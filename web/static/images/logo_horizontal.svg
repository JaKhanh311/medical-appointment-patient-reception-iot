<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120">
  <defs>
    <!-- Strong diagonal teal gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1AADA3"/>
      <stop offset="40%"  stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#063D38"/>
    </linearGradient>

    <!-- QR fill -->
    <linearGradient id="qrFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#063D38"/>
    </linearGradient>

    <!-- Heart: vivid red to deep crimson -->
    <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF8A80"/>
      <stop offset="45%"  stop-color="#F44336"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>

    <!-- Radial shine on heart -->
    <radialGradient id="heartShine" cx="38%" cy="30%" r="55%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Light bloom top-left of icon -->
    <radialGradient id="bgBloom" cx="15%" cy="12%" r="55%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Wordmark: teal gradient top to bottom -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#063D38"/>
    </linearGradient>

    <!-- Gold gradient for "QR" -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F0C060"/>
      <stop offset="100%" stop-color="#A07030"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7"
                    flood-color="#063D38" flood-opacity="0.35"/>
    </filter>

    <filter id="ecgGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Icon background ── -->
  <rect x="10" y="10" width="100" height="100" rx="18"
        fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="10" y="10" width="100" height="100" rx="18"
        fill="url(#bgBloom)"/>
  <rect x="11.5" y="11.5" width="97" height="97" rx="17"
        fill="none" stroke="white" stroke-opacity="0.12" stroke-width="1.2"/>

  <!-- QR corner: Top-Left -->
  <rect x="19" y="19" width="28" height="28" rx="5" fill="white"/>
  <rect x="23" y="23" width="20" height="20" rx="3" fill="url(#qrFill)"/>
  <rect x="27" y="27" width="12" height="12" rx="2" fill="white"/>

  <!-- QR corner: Top-Right -->
  <rect x="73" y="19" width="28" height="28" rx="5" fill="white"/>
  <rect x="77" y="23" width="20" height="20" rx="3" fill="url(#qrFill)"/>
  <rect x="81" y="27" width="12" height="12" rx="2" fill="white"/>

  <!-- QR corner: Bottom-Left -->
  <rect x="19" y="73" width="28" height="28" rx="5" fill="white"/>
  <rect x="23" y="77" width="20" height="20" rx="3" fill="url(#qrFill)"/>
  <rect x="27" y="81" width="12" height="12" rx="2" fill="white"/>

  <!-- QR data pixels: top-middle -->
  <g fill="white" opacity="0.80">
    <rect x="51" y="19" width="5" height="5" rx="1"/>
    <rect x="59" y="19" width="5" height="5" rx="1"/>
    <rect x="67" y="19" width="5" height="5" rx="1"/>
    <rect x="51" y="27" width="5" height="5" rx="1"/>
    <rect x="67" y="27" width="5" height="5" rx="1"/>
    <rect x="51" y="35" width="5" height="5" rx="1"/>
    <rect x="59" y="35" width="5" height="5" rx="1"/>
  </g>

  <!-- QR data pixels: left-middle -->
  <g fill="white" opacity="0.80">
    <rect x="19" y="51" width="5" height="5" rx="1"/>
    <rect x="27" y="51" width="5" height="5" rx="1"/>
    <rect x="19" y="59" width="5" height="5" rx="1"/>
    <rect x="35" y="59" width="5" height="5" rx="1"/>
    <rect x="19" y="67" width="5" height="5" rx="1"/>
    <rect x="27" y="67" width="5" height="5" rx="1"/>
  </g>

  <!-- QR data pixels: bottom-right -->
  <g fill="white" opacity="0.80">
    <rect x="73" y="73" width="5" height="5" rx="1"/>
    <rect x="81" y="73" width="5" height="5" rx="1"/>
    <rect x="89" y="73" width="5" height="5" rx="1"/>
    <rect x="73" y="81" width="5" height="5" rx="1"/>
    <rect x="89" y="81" width="5" height="5" rx="1"/>
    <rect x="73" y="89" width="5" height="5" rx="1"/>
    <rect x="81" y="89" width="5" height="5" rx="1"/>
    <rect x="89" y="89" width="5" height="5" rx="1"/>
    <rect x="81" y="97" width="5" height="5" rx="1"/>
    <rect x="89" y="97" width="5" height="5" rx="1"/>
  </g>

  <!-- Heart centered at (60, 60) -->
  <path d="M 60 57
           C 60 52, 54 47, 49 47
           C 42 47, 39 53, 39 57
           C 39 68, 49 75, 60 82
           C 71 75, 81 68, 81 57
           C 81 53, 78 47, 71 47
           C 66 47, 60 52, 60 57 Z"
        fill="url(#heartGrad)"/>

  <!-- Shine -->
  <path d="M 60 57
           C 60 52, 54 47, 49 47
           C 42 47, 39 53, 39 57
           C 39 68, 49 75, 60 82
           C 71 75, 81 68, 81 57
           C 81 53, 78 47, 71 47
           C 66 47, 60 52, 60 57 Z"
        fill="url(#heartShine)"/>

  <!-- ECG line with glow -->
  <polyline points="43,59  49,59  53,50  57,68  61,54  65,59  77,59"
            stroke="white" stroke-width="1.5" fill="none" opacity="0.4"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#ecgGlow)"/>
  <polyline points="43,59  49,59  53,50  57,68  61,54  65,59  77,59"
            stroke="white" stroke-width="2.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Wordmark ── -->
  <!-- Shadow layer -->
  <text x="130" y="70"
        font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
        font-size="47" font-weight="900" letter-spacing="-1"
        fill="#063D38" opacity="0.12">OPDFlow</text>

  <!-- Main text -->
  <text x="128" y="68"
        font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
        font-size="47" font-weight="900" letter-spacing="-1">
    <tspan fill="url(#textGrad)">OPD</tspan><tspan fill="url(#goldGrad)">Flow</tspan>
  </text>

  <!-- Tagline -->
  <text x="130" y="90"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="600"
        letter-spacing="4.5"
        fill="#0F766E" opacity="0.75">SMART HEALTHCARE</text>
</svg>
