<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Strong diagonal teal gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1AADA3"/>
      <stop offset="40%"  stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#063D38"/>
    </linearGradient>

    <!-- QR fill: slightly distinct from bg -->
    <linearGradient id="qrFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#063D38"/>
    </linearGradient>

    <!-- Heart: bright red to deep crimson -->
    <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF8A80"/>
      <stop offset="45%"  stop-color="#F44336"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>

    <!-- Radial shine on heart -->
    <radialGradient id="heartShine" cx="38%" cy="30%" r="55%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Bloom on icon bg top-left -->
    <radialGradient id="bgBloom" cx="15%" cy="12%" r="55%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7"
                    flood-color="#063D38" flood-opacity="0.40"/>
    </filter>

    <filter id="ecgGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="5" y="5" width="190" height="190" rx="30"
        fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="5" y="5" width="190" height="190" rx="30"
        fill="url(#bgBloom)"/>
  <rect x="7" y="7" width="186" height="186" rx="29"
        fill="none" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- QR corner: Top-Left -->
  <rect x="18" y="18" width="48" height="48" rx="7" fill="white"/>
  <rect x="25" y="25" width="34" height="34" rx="5" fill="url(#qrFill)"/>
  <rect x="32" y="32" width="20" height="20" rx="3" fill="white"/>

  <!-- QR corner: Top-Right -->
  <rect x="134" y="18" width="48" height="48" rx="7" fill="white"/>
  <rect x="141" y="25" width="34" height="34" rx="5" fill="url(#qrFill)"/>
  <rect x="148" y="32" width="20" height="20" rx="3" fill="white"/>

  <!-- QR corner: Bottom-Left -->
  <rect x="18" y="134" width="48" height="48" rx="7" fill="white"/>
  <rect x="25" y="141" width="34" height="34" rx="5" fill="url(#qrFill)"/>
  <rect x="32" y="148" width="20" height="20" rx="3" fill="white"/>

  <!-- QR data pixels: top-middle -->
  <g fill="white" opacity="0.80">
    <rect x="86" y="18" width="8" height="8" rx="2"/>
    <rect x="98" y="18" width="8" height="8" rx="2"/>
    <rect x="110" y="18" width="8" height="8" rx="2"/>
    <rect x="86" y="30" width="8" height="8" rx="2"/>
    <rect x="110" y="30" width="8" height="8" rx="2"/>
    <rect x="86" y="42" width="8" height="8" rx="2"/>
    <rect x="98" y="42" width="8" height="8" rx="2"/>
  </g>

  <!-- QR data pixels: left-middle -->
  <g fill="white" opacity="0.80">
    <rect x="18" y="86" width="8" height="8" rx="2"/>
    <rect x="30" y="86" width="8" height="8" rx="2"/>
    <rect x="18" y="98" width="8" height="8" rx="2"/>
    <rect x="42" y="98" width="8" height="8" rx="2"/>
    <rect x="18" y="110" width="8" height="8" rx="2"/>
    <rect x="30" y="110" width="8" height="8" rx="2"/>
    <rect x="42" y="110" width="8" height="8" rx="2"/>
  </g>

  <!-- QR data pixels: bottom-right -->
  <g fill="white" opacity="0.80">
    <rect x="134" y="134" width="8" height="8" rx="2"/>
    <rect x="146" y="134" width="8" height="8" rx="2"/>
    <rect x="158" y="134" width="8" height="8" rx="2"/>
    <rect x="134" y="146" width="8" height="8" rx="2"/>
    <rect x="158" y="146" width="8" height="8" rx="2"/>
    <rect x="134" y="158" width="8" height="8" rx="2"/>
    <rect x="146" y="158" width="8" height="8" rx="2"/>
    <rect x="158" y="158" width="8" height="8" rx="2"/>
    <rect x="146" y="170" width="8" height="8" rx="2"/>
    <rect x="158" y="170" width="8" height="8" rx="2"/>
  </g>

  <!-- Heart centered at (100, 100) -->
  <path d="M 100 88
           C 100 80, 90 72, 81 72
           C 69 72, 64 83, 64 92
           C 64 110, 81 122, 100 133
           C 119 122, 136 110, 136 92
           C 136 83, 131 72, 119 72
           C 110 72, 100 80, 100 88 Z"
        fill="url(#heartGrad)"/>

  <!-- Shine -->
  <path d="M 100 88
           C 100 80, 90 72, 81 72
           C 69 72, 64 83, 64 92
           C 64 110, 81 122, 100 133
           C 119 122, 136 110, 136 92
           C 136 83, 131 72, 119 72
           C 110 72, 100 80, 100 88 Z"
        fill="url(#heartShine)"/>

  <!-- ECG line with glow -->
  <polyline points="70,99  78,99  84,85  90,113  96,90  102,99  130,99"
            stroke="white" stroke-width="2" fill="none" opacity="0.4"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#ecgGlow)"/>
  <polyline points="70,99  78,99  84,85  90,113  96,90  102,99  130,99"
            stroke="white" stroke-width="3" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
